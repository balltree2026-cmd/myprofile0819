<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-6 selection:bg-indigo-100 selection:text-indigo-700">

    <main class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-8 sm:p-10 text-center border border-slate-100 transform transition-all">
        
        <!-- 프로필 사진 영역 -->
        <div class="relative w-36 h-36 mx-auto mb-6">
            <img 
                src="myphoto.png" 
                alt="프로필 사진" 
                onerror="this.onerror=null; this.src='https://placehold.co/300x300/e2e8f0/475569?text=Profile';"
                class="w-full h-full object-cover rounded-full ring-4 ring-slate-100 shadow-md"
            />
        </div>

        <!-- 이름 -->
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight mb-2">
            김미리
        </h1>

        <!-- 한 줄 소개 -->
        <p class="text-sm sm:text-base font-medium text-indigo-600 bg-indigo-50/80 inline-block px-4 py-1.5 rounded-full mb-6">
            AI와 함께하는 일상
        </p>

        <!-- 3~4줄 짧은 자기소개 -->
        <div class="text-slate-600 text-sm sm:text-base leading-relaxed space-y-2 text-center font-normal border-t border-slate-100 pt-6">
            <p>
                AI를 활용하여 일상을 여유롭고 편리하게 생활하고 음악을 즐기며 도전하는 삶을 살아가고 있습니다.
            </p>
        </div>

    </main>

</body>
</html>
